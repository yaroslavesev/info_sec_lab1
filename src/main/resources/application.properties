spring.application.name=lab1
spring.datasource.url=jdbc:h2:mem:lab1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.seed.username=${APP_SEED_USERNAME:admin}
app.seed.password=${APP_SEED_PASSWORD:local-demo-password}
app.seed.role=${APP_SEED_ROLE:ROLE_USER}
app.jwt.secret=${APP_JWT_SECRET:local-dev-only-jwt-secret-32-bytes-min}
app.jwt.ttl-seconds=3600