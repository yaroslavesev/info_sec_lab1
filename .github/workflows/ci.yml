name: CI

on:
  push:
  pull_request:

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-v12
          restore-keys: |
            dependency-check-data-${{ runner.os }}-
      - name: Run tests
        run: ./mvnw -B test
      - name: Run SpotBugs SAST
        run: ./mvnw -B spotbugs:check
      - name: Run OWASP Dependency-Check SCA
        run: ./mvnw -B dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            target/site/spotbugs.html
            target/dependency-check-report.*
          if-no-files-found: warn
